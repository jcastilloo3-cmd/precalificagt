# Análisis estático en SonarCloud (E12). El token y la URL los inyecta Jenkins con
# withSonarQubeEnv('SonarQube2026A'); la rama o el PR se pasan desde el Jenkinsfile.
sonar.organization=jcastilloo3-cmd
sonar.projectKey=jcastilloo3-cmd_precalificagt
sonar.projectName=PrecalificaGT
sonar.projectVersion=1.0

# Código de la aplicación (backend Python y frontend PHP)
sonar.sources=backend/app,frontend/includes,frontend/public
sonar.tests=backend/tests,frontend/tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.exclusions=**/__pycache__/**,frontend/public/assets/**

# Resultados de pruebas y cobertura generados en la etapa 2 del pipeline
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/pytest.xml
# Solo se instrumenta el backend (pytest-cov); medir PHP exigiría Xdebug o PCOV en el agente
sonar.coverage.exclusions=frontend/**
