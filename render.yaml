# Blueprint de Render (capa gratuita) del ambiente PROD (rama main).
# El ambiente QA (rama QA) usa dos servicios equivalentes creados desde el panel:
#   precalificagt-api-qa y precalificagt-web-qa, con los mismos Dockerfiles, Branch = QA
#   y Auto-Deploy = Off (ver docs/fase2/ESTRATEGIA_RAMAS.md). No se declaran aquí para
#   que la sincronización del Blueprint no los duplique.
# autoDeploy: false — Render ya no despliega con cada push: solo Jenkins dispara el
# despliegue (deploy hook) cuando el pipeline pasó todas sus etapas (E13).
# Las bases PostgreSQL están en Neon (rama principal para PROD y rama "qa" para QA);
# su cadena de conexión se coloca en DATABASE_URL desde el panel de Render.
services:
  - type: web
    name: precalificagt-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: false
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false

  - type: web
    name: precalificagt-web
    runtime: docker
    plan: free
    branch: main
    autoDeploy: false
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: API_URL
        sync: false
