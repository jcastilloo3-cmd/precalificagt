# Ambiente local completo: PostgreSQL + API (Python/Flask) + Web (PHP/Apache)
# Uso: docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: precalifica
      POSTGRES_USER: precalifica
      POSTGRES_PASSWORD: precalifica
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precalifica -d precalifica"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://precalifica:precalifica@db:5432/precalifica
      SECRET_KEY: clave-local-solo-para-desarrollo
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      API_URL: http://api:5000
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  datos_pg:
